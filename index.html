<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahalaxmi Petroleum – Daily DSR</title>

<style>
body { font-family: Arial; background: #eef2f5; padding: 12px; margin: 0; }

/* HEADER */
.header {
  display:flex;
  align-items:center;
  gap:12px;
  background:#ffffff;
  padding:12px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 3px 8px rgba(0,0,0,0.12);
}

/* Mobile layout */
@media (max-width: 600px) {
  .header {
    flex-direction: column;
    text-align: center;
  }

  .logo {
    height: 60px;
  }
}

}
.logo { height:70px; }
.title h1 { margin:0; color:#c40000; font-size:22px; }
.title p { margin:0; color:#003087; font-weight:bold; letter-spacing:1px; }
.prevVal {
  font-size:12px;
  color:#666;
  text-align:right;
}
.fieldWrap {
  display: flex;
  flex-direction: column;
}

.prevVal {
  font-size: 12px;
  color: #666;
  margin-top: 4px;
  text-align: right;
}

/* SECTIONS */
.section { background:#fff; padding:15px; margin-bottom:15px; border-radius:10px; box-shadow:0 2px 6px rgba(0,0,0,0.08); }
h2 { margin:0 0 10px; } 
h3 { margin:0 0 8px; font-size:16px; }

.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
input { padding:10px; font-size:16px; border-radius:6px; border:1px solid #ccc; }

/* BUTTON */
button {
  width:100%;
  padding:14px;
  font-size:18px;
  background:#0d6efd;
  color:white;
  border:none;
  border-radius:8px;
  margin-top:10px;
  cursor:pointer;
  transition:0.2s;
}
button:hover { background:#0b5ed7; }
button:disabled { background:#9bb7e0; cursor:not-allowed; }

/* READONLY */
.readonly { background:#f1f4f7; padding:12px; border-radius:6px; text-align:center; font-weight:bold; }

.ms { background:#e7f3ff; }
.hsd { background:#e8f8f5; }
.power { background:#f3e8ff; }
.testing { background:#fef4e6; }

.total { background:#d1e7dd; font-size:22px; }
.final { background:#fff3cd; font-size:24px; }

/* LOADER */
#loader {
  display:none;
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.75);
  z-index:9999;
  justify-content:center;
  align-items:center;
}
#loader div {
  border:6px solid #eee;
  border-top:6px solid #0d6efd;
  border-radius:50%;
  width:50px;
  height:50px;
  animation:spin 1s linear infinite;
}
@keyframes spin {
  0% { transform:rotate(0deg); }
  100% { transform:rotate(360deg); }
}
</style>
</head>

<body>

<div class="header">
  <img src="hpcl.png" alt="HPCL Logo" class="logo">
  <div class="title">
    <h1>Mahalaxmi Petroleum</h1>
    <p>Daily Sales Register</p>
  </div>
</div>

<div id="loader"><div></div></div>

<div class="section">
  <h2>Date</h2>
  <input type="date" id="date">
</div>

<div class="section">
  <h2>Fuel Readings</h2>

  <div class="section ms">
    <h3>MS (Petrol)</h3>
    <div class="grid" id="msInputs"></div>
  </div>

  <div class="section hsd">
    <h3>HSD (Diesel)</h3>
    <div class="grid" id="hsdInputs"></div>
  </div>

  <div class="section power">
    <h3>Power</h3>
    <div class="grid" id="powerInputs"></div>
  </div>

  <div class="section testing">
    <h3>Testing / Product Checks</h3>
    <div class="grid" id="testingInputs"></div>
  </div>

  <button id="btnFuel" onclick="submitFuel()">
Calculate Sale</button>
</div>

<div class="section">
  <h2>Sale Breakup</h2>
  <div class="grid">
    <div class="readonly" id="msSale">MS —</div>
    <div class="readonly" id="hsdSale">HSD —</div>
    <div class="readonly" id="powerSale">Power —</div>
  </div>
  <div class="readonly total" id="totalSale">Total Sale ₹ —</div>
</div>

<div class="section">
  <h2>Payments & Expenses</h2>
  <div class="grid" id="paymentInputs"></div>
  <button id="btnPay" onclick="submitPaymentsOnly()">Calculate Final Hisab</button>
</div>

<div class="section">
  <h2>Final Hisab</h2>
  <div class="readonly final" id="finalHisab">₹ —</div>
</div>

<script>
const apiURL = "https://script.google.com/macros/s/AKfycbzwBzFIxfTgJxTQHWtitgV-_znHHgqysjpvUn8DlYNrKgaWMn8HBuGOxKOA1SezEgZ7/exec";

const btnFuel = document.getElementById("btnFuel");
const btnPay = document.getElementById("btnPay");
const dateInput = document.getElementById("date");
const loader = document.getElementById("loader");

const msLabels = ["MS1","MS2","MS3","MS4"];
const hsdLabels = ["HSD1","HSD2"];
const powerLabels = ["Power1","Power2"];
const testLabels = ["MS","HSD","Power"];
const paymentLabels = ["Online Trf","Paytm","Cash1","Cash2","Cash3","Udhari","Advances","Salary","Incentive","Expenses","Hp Pay","CCMS"];

function createInputs(container, labels, prefix, showPrev=false){
  labels.forEach(l => {

    const wrap = document.createElement("div");
    wrap.className = "fieldWrap";

    const input = document.createElement("input");
    input.type = "text";
    input.inputMode = "decimal";
    input.placeholder = l;
    input.id = prefix + l.replace(/\s+/g,'');

    input.addEventListener("keydown", function(e){
      if(e.key === "Enter"){
        e.preventDefault();
        const all = Array.from(document.querySelectorAll("input"));
        const idx = all.indexOf(e.target);
        if(idx < all.length-1) all[idx+1].focus();
      }
    });

    wrap.appendChild(input);

    if(showPrev){
      const prev = document.createElement("div");
      prev.className = "prevVal";
      prev.id = "prev_"+prefix+l.replace(/\s+/g,'');
      prev.innerText = "Prev —";
      wrap.appendChild(prev);
    }

    container.appendChild(wrap);
  });
}



// Fuel meters → show previous
createInputs(msInputs, msLabels, "f", true);
createInputs(hsdInputs, hsdLabels, "f", true);
createInputs(powerInputs, powerLabels, "f", true);

// Testing → no previous
createInputs(testingInputs, testLabels, "f", false);

// Payments → no previous
createInputs(paymentInputs, paymentLabels, "p", false);

const fuelOrder = [...msLabels, ...hsdLabels, ...powerLabels, ...testLabels];

function showLoader(){
  loader.style.display = "flex";
  btnFuel.disabled = true;
  btnPay.disabled = true;
}

function hideLoader(){
  loader.style.display = "none";
  btnFuel.disabled = false;
  btnPay.disabled = false;
}
window.addEventListener("unhandledrejection", hideLoader);

function loadPrevious(){
  const d = dateInput.value;
  if(!d) return;

  fetch(apiURL + "?date=" + d)
    .then(r => r.json())
    .then(res => {

      if(!res.prev){
        document.querySelectorAll(".prevVal")
          .forEach(el => el.innerText = "Prev —");
        return;
      }

    const meterLabels = [...msLabels, ...hsdLabels, ...powerLabels];

meterLabels.forEach((label, i) => {
  const el = document.getElementById("prev_f"+label);
  if(el){
    el.innerText = "Prev: " + (res.prev[i] ?? "—");
  }
});

    })
    .catch(()=>{});
}

function submitFuel(){
  const dateVal = date.value;
  if(!dateVal){ alert("Please select a date."); return; }

  const values = fuelOrder.map(l => Number(document.getElementById("f"+l).value) || 0);

  showLoader();
  fetch(apiURL, {
  method: "POST",
  body: JSON.stringify({
    date: dateVal,
    block1: values
  })
})
.then(r => r.json())
.then(d => {
  hideLoader();
  if (d.error) { alert(d.error); return; }

  const [msQty, hsdQty, powerQty, msRate, hsdRate, powerRate] = d.fuelBlock;

  msSale.innerText = `MS: ${msQty} × ₹${msRate} = ₹${(msQty * msRate).toFixed(2)}`;
  hsdSale.innerText = `HSD: ${hsdQty} × ₹${hsdRate} = ₹${(hsdQty * hsdRate).toFixed(2)}`;
  powerSale.innerText = `Power: ${powerQty} × ₹${powerRate} = ₹${(powerQty * powerRate).toFixed(2)}`;
  totalSale.innerText = `Total Sale ₹ ${d.totalSale}`;
})
.catch(err => { hideLoader(); alert("Backend not reachable"); console.error(err); });
}

function submitPaymentsOnly(){
  const dateVal = date.value;
  if(!dateVal){
    alert("Please select a date.");
    return;
  }

  // ORDER STRICTLY FOLLOWS paymentLabels (incl. Salary)
  const values = paymentLabels.map(l =>
    Number(document.getElementById("p"+l.replace(/\s+/g,'')).value) || 0
  );

  showLoader();

  fetch(apiURL, {
    method: "POST",
    body: JSON.stringify({
      date: dateVal,
      block2: values
    })
  })
  .then(r => r.json())
  .then(d => {
    hideLoader();

    if(d.error){
      alert(d.error);
      return;
    }

    finalHisab.innerText = `₹ ${d.finalHisab}`;

    // 🔒 lock after final submit
    dateInput.disabled = true;
    btnFuel.disabled = true;
    btnPay.disabled = true;
  })
  .catch(err => {
    hideLoader();
    alert("Backend not reachable");
    console.error(err);
  });
}

dateInput.addEventListener("change", loadPrevious);
</script>

</body>
</html>
