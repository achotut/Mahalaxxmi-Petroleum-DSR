<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mahalaxmi Petroleum – Daily DSR</title>

<style>
body { font-family: Arial; background: #eef2f5; padding: 12px; margin: 0; }
.section { background: #fff; padding: 15px; margin-bottom: 15px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
h2 { margin:0 0 10px; } 
h3 { margin:0 0 8px; font-size:16px; }

.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; }
input { padding:10px; font-size:16px; border-radius:6px; border:1px solid #ccc; text-align:left; }

button { width:100%; padding:14px; font-size:18px; background:#0d6efd; color:white; border:none; border-radius:8px; margin-top:10px; cursor:pointer; }
button:hover { background:#0b5ed7; }

.readonly { background:#f1f4f7; padding:12px; border-radius:6px; text-align:center; font-weight:bold; }

.ms { background:#e7f3ff; }
.hsd { background:#e8f8f5; }
.power { background:#f3e8ff; }
.testing { background:#fef4e6; }

.total { background:#d1e7dd; font-size:22px; margin-top:10px; }
.final { background:#fff3cd; font-size:24px; margin-top:10px; }

#loader {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(255,255,255,0.7);
  z-index:9999;
  justify-content:center;
  align-items:center;
}
#loader div {
  border:6px solid #f3f3f3;
  border-top:6px solid #0d6efd;
  border-radius:50%;
  width:50px; height:50px;
  animation:spin 1s linear infinite;
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
</style>
</head>

<body>

<div class="header">
  <img src="hpcl.png" alt="HPCL Logo" class="logo">
  <div class="title">
    <h1>Mahalaxmi Petroleum</h1>
    <p>Daily Sales Register</p>
  </div>
</div>

<div id="loader"><div></div></div>

<div class="section">
  <h2>Date</h2>
  <input type="date" id="date">
</div>

<div class="section">
  <h2>Fuel Readings</h2>

  <div class="section ms">
    <h3>MS (Petrol)</h3>
    <div class="grid" id="msInputs"></div>
  </div>

  <div class="section hsd">
    <h3>HSD (Diesel)</h3>
    <div class="grid" id="hsdInputs"></div>
  </div>

  <div class="section power">
    <h3>Power</h3>
    <div class="grid" id="powerInputs"></div>
  </div>

  <div class="section testing">
    <h3>Testing / Product Checks</h3>
    <div class="grid" id="testingInputs"></div>
  </div>

  <button onclick="submitFuel()">Calculate Sale</button>
</div>

<div class="section">
  <h2>Sale Breakup</h2>
  <div class="grid">
    <div class="readonly" id="msSale">MS —</div>
    <div class="readonly" id="hsdSale">HSD —</div>
    <div class="readonly" id="powerSale">Power —</div>
  </div>
  <div class="readonly total" id="totalSale">Total Sale ₹ —</div>
</div>

<div class="section">
  <h2>Payments & Expenses</h2>
  <div class="grid" id="paymentInputs"></div>
  <button onclick="submitPaymentsOnly()">Calculate Final Hisab</button>
</div>

<div class="section">
  <h2>Final Hisab</h2>
  <div class="readonly final" id="finalHisab">₹ —</div>
</div>

<script>
const apiURL = "https://script.google.com/macros/s/AKfycbyFqFZOmK-3UIK_AFCtOVRtx6-IYz25MpW65u-UWehDj2smOMspu-7qbwI7vntkURqk/exec";

const msLabels = ["MS1","MS2","MS3","MS4"];
const hsdLabels = ["HSD1","HSD2"];
const powerLabels = ["Power1","Power2"];
const testLabels = ["MS","HSD","Power"];
const paymentLabels = ["Online Trf","Paytm","Cash1","Cash2","Cash3","Udhari","Advances","Incentive","Expenses","Hp Pay","CCMS"];

function createInputs(container, labels, prefix){
  labels.forEach((l, index) => {
    const input = document.createElement("input");
    input.type = "text";               // text for better mobile control
    input.inputMode = "decimal";       // numeric keypad with decimal
    input.pattern = "[0-9]*";          // hint for mobile
    input.placeholder = l;
    input.id = prefix + l;

    // Auto-focus to next input on Enter
    input.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === "Tab"){
        e.preventDefault();
        // find all inputs in container
        const allInputs = Array.from(container.querySelectorAll("input"));
        const nextIndex = allInputs.indexOf(e.target) + 1;
        if(nextIndex < allInputs.length){
          allInputs[nextIndex].focus();
        }
      }
    });

    container.appendChild(input);
  });
}

// Create all inputs
createInputs(msInputs, msLabels, "f");
createInputs(hsdInputs, hsdLabels, "f");
createInputs(powerInputs, powerLabels, "f");
createInputs(testingInputs, testLabels, "f");
createInputs(paymentInputs, paymentLabels, "p");

const fuelOrder = [...msLabels, ...hsdLabels, ...powerLabels, ...testLabels];

function showLoader(){ loader.style.display = "flex"; }
function hideLoader(){ loader.style.display = "none"; }

window.addEventListener("unhandledrejection", hideLoader);

function submitFuel(){
  const dateVal = date.value;
  if(!dateVal){ alert("Please select a date."); return; }

  const values = fuelOrder.map(l => Number(document.getElementById("f"+l).value) || 0);

  showLoader();
  fetch(apiURL, {
  method: "POST",
  body: JSON.stringify({
    date: dateVal,
    block1: values
  })
})
.then(r => r.json())
.then(d => {
  hideLoader();
  if (d.error) { alert(d.error); return; }

  const [msQty, hsdQty, powerQty, msRate, hsdRate, powerRate] = d.fuelBlock;

  msSale.innerText = `MS: ${msQty} × ₹${msRate} = ₹${(msQty * msRate).toFixed(2)}`;
  hsdSale.innerText = `HSD: ${hsdQty} × ₹${hsdRate} = ₹${(hsdQty * hsdRate).toFixed(2)}`;
  powerSale.innerText = `Power: ${powerQty} × ₹${powerRate} = ₹${(powerQty * powerRate).toFixed(2)}`;
  totalSale.innerText = `Total Sale ₹ ${d.totalSale}`;
})
.catch(err => { hideLoader(); alert("Backend not reachable"); console.error(err); });
}

function submitPaymentsOnly(){
  const dateVal = date.value;
  if(!dateVal){ alert("Please select a date."); return; }

  const values = paymentLabels.map(l => Number(document.getElementById("p"+l).value) || 0);

  showLoader();
  fetch(apiURL, {
  method: "POST",
  body: JSON.stringify({
    date: dateVal,
    block2: values
  })
})
.then(r => r.json())
.then(d => {
  hideLoader();
  if(d.error){ alert(d.error); return; }
  finalHisab.innerText = `₹ ${d.finalHisab}`;
})
.catch(err => { hideLoader(); alert("Backend not reachable"); console.error(err); });
}
</script>

</body>
</html>
